# Production server block for the FAHR platform mockup.
#
# The mockup is a static Vite/React SPA, so nginx only has to serve files and
# fall back to index.html for client-side (wouter) routes. The one piece of
# logic is the platform-wide HTTP Basic guard: in dev and preview it comes from
# `basicAuthVitePlugin` in lib/basic-auth, which has no equivalent once the app
# is a pile of static files. `/docker-entrypoint.d/20-platform-auth.sh` rebuilds
# the same rule as an nginx include on every container start.

# Cache-Control is decided once, here, so no `add_header` is needed inside the
# locations below. A nested `add_header` replaces the whole inherited set, and
# that is how security headers silently go missing.
map $uri $fahr_cache_control {
    # Hashed filenames from `vite build` — safe to pin forever.
    ~^/assets/    "public, max-age=31536000, immutable";
    # Unhashed names: the entry document and anything that replaces it on a
    # deploy must be revalidated or a release never reaches the browser.
    ~*\.html$     "no-store, must-revalidate";
    "/"           "no-store, must-revalidate";
    # Logos, screenshots and other public/ assets: short shared cache.
    default       "public, max-age=3600";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Every response is credential-gated, so proxies must key on the header.
    add_header Vary "Authorization" always;
    add_header Cache-Control $fahr_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff2;

    # Uploads are meaningless for a static site; keep the surface small.
    client_max_body_size 1m;

    # Public, matching `publicPaths: ["/healthz"]` in vite.config.ts. Declared
    # before the guarded locations so the container health check never needs
    # credentials. No `add_header` here on purpose — it would drop the set above.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        include /etc/nginx/platform-auth.conf;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/platform-auth.conf;
        try_files $uri $uri/ /index.html;
    }
}
